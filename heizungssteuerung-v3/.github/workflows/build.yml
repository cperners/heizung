name: Firmware und Regelung
on: [push, pull_request, workflow_dispatch]
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tests/run_host_tests.sh
      - run: tests/run_stove_tests.sh
      - run: tests/run_modes_tests.sh
      - run: tests/run_display_idle_tests.sh
      - run: python3 tests/check_touch_settings_fields.py
      - name: Display-Zahlencode pruefen
        run: OPENSSL_ROOT=/usr tests/run_touch_access_tests.sh
      - run: sh tests/run_ota_tests.sh
      - run: sh tests/run_sensor_diagnostics_tests.sh
      - run: sh tests/run_rest_heat_tests.sh
  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.5
    steps:
      - uses: actions/checkout@v4
      - name: ESP32-P4 Firmware bauen
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          bash scripts/setup-display-deps.sh
          export IDF_COMPONENT_MANAGER=0
          idf.py set-target esp32p4
          idf.py build
